name: Publicar site Kamba

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "favicon.svg"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site público
        run: |
          mkdir -p _site
          cp -- *.html _site/
          cp -- favicon.svg robots.txt sitemap.xml _site/
          cp -r css js _site/

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
